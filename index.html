
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>English Trainer</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <h1>English Trainer</h1>
        <p>Seu professor particular de inglês</p>
    </header>

    <main>
        <section class="translator">

            <h2>Aprenda inglês passo a passo aqui com vinicius</h2>

            <label for="portuguese">
                Escreva sua frase em português:
            </label>

            <textarea
                id="portuguese"
                placeholder="Exemplo: Eu acordei cedo hoje..."
            ></textarea>

            <button id="translateBtn">
                Traduzir e explicar
            </button>

            <div id="result">
                <p>Sua tradução aparecerá aqui.</p>
            </div>

        </section>
    </main>

    <script src="js/main.js"></script>

</body>
</html>
